<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <title>FSK Sosiale medier 1080×1080</title>
  <link rel="stylesheet" href="../../css/tokens.css">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--font-sans);
      background: #888;
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 32px;
    }

    /* 1080×1080 skalert ned for skjermvisning */
    .post-wrap {
      transform: scale(0.48);
      transform-origin: top center;
      width: 1080px;
      height: 1080px;
    }

    .post {
      width: 1080px;
      height: 1080px;
      background: var(--color-dark-blue);
      color: var(--color-offwhite);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    /* Dekorativ grønn blokk øverst til høyre */
    .post::before {
      content: "";
      position: absolute;
      top: -120px;
      right: -120px;
      width: 480px;
      height: 480px;
      background: var(--color-light-green);
      border-radius: 50%;
      opacity: 0.18;
    }

    /* Header */
    .post__header {
      display: flex;
      align-items: center;
      gap: 28px;
      padding: 72px 80px 0;
    }
    .post__header img { height: 64px; width: auto; }
    .post__brand {
      font-weight: var(--fw-bold);
      font-size: 28px;
      line-height: 1.2;
      color: var(--color-offwhite);
    }

    /* Innhold */
    .post__body {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 80px;
    }
    .post__category {
      display: inline-block;
      background: var(--color-light-green);
      color: var(--color-dark-blue);
      font-size: 20px;
      font-weight: var(--fw-bold);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 8px 24px;
      border-radius: 999px;
      margin-bottom: 48px;
      align-self: flex-start;
    }
    .post__bar {
      width: 100px;
      height: 10px;
      background: var(--color-light-green);
      border-radius: 999px;
      margin-bottom: 36px;
    }
    .post__title {
      font-size: 110px;
      line-height: 1.0;
      font-weight: var(--fw-bold);
      letter-spacing: -0.03em;
      color: var(--color-offwhite);
      margin: 0;
    }
    .post__subtitle {
      font-size: 40px;
      font-weight: var(--fw-normal);
      color: var(--color-light-blue);
      margin: 40px 0 0;
      line-height: 1.3;
    }

    /* Footer */
    .post__footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 80px 72px;
      font-size: 28px;
      font-weight: var(--fw-semibold);
      color: var(--color-light-green);
    }

    @media print {
      @page { size: 1080px 1080px; margin: 0; }
      body { background: transparent; padding: 0; display: block; }
      .post-wrap { transform: none; }
    }
  </style>
</head>
<body>
  <div class="post-wrap">
    <div class="post">

      <div class="post__header">
        <img src="../../assets/logo/fsk-logo-emblem.svg" alt="FSK logo">
        <div class="post__brand">Fredrikstad<br>Skiklubb</div>
      </div>

      <div class="post__body">
        <span class="post__category">Arrangement</span>
        <div class="post__bar"></div>
        <h1 class="post__title">Din<br>beskjed her</h1>
        <p class="post__subtitle">Undertittel eller dato og sted</p>
      </div>

      <div class="post__footer">
        <span>fsk.no</span>
        <span>@fredrikstadskiklubb</span>
      </div>

    </div>
  </div>
</body>
</html>
