<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <title>FSK Flyer A5</title>
  <link rel="stylesheet" href="../../css/tokens.css">
  <style>
    @page { size: A5 portrait; margin: 0; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: var(--font-sans); background: #555; }
    .sheet {
      width: 148mm; min-height: 210mm;
      margin: 16px auto; background: var(--color-white);
      display: flex; flex-direction: column;
      box-shadow: 0 8px 24px rgba(0,0,0,.35);
    }
    .sheet__top { background: var(--color-primary); color: #fff; padding: 16mm 14mm; }
    .sheet__logo { font-weight: 700; font-size: 11pt; letter-spacing: .04em; opacity: .9; }
    .sheet__title { font-size: 26pt; line-height: 1.05; font-weight: 700; margin: 6mm 0 0; }
    .sheet__body { padding: 12mm 14mm; flex: 1; }
    .sheet__lead { font-size: 13pt; color: var(--color-ink-soft); }
    .sheet__bottom { background: var(--color-accent); color: var(--color-ink); padding: 8mm 14mm; font-weight: 700; font-size: 11pt; }
    @media print { body { background: #fff; } .sheet { margin: 0; box-shadow: none; } }
  </style>
</head>
<body>
  <div class="sheet">
    <div class="sheet__top">
      <!-- TODO: bytt til ekte FSK-logo fra /assets/logo -->
      <div class="sheet__logo">FREDRIKSTAD SKIKLUBB</div>
      <div class="sheet__title">Overskrift</div>
    </div>
    <div class="sheet__body">
      <p class="sheet__lead">Ingress med det viktigste.</p>
      <p>Detaljer, tid, sted og påmelding.</p>
    </div>
    <div class="sheet__bottom">Dato · Sted · fsk.no</div>
  </div>
</body>
</html>
